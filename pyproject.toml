[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-policy-guard"
version = "0.1.0"
description = "AWS IAM Least Privilege security gate for Terraform plans"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["aws", "iam", "security", "terraform", "devsecops", "policy-as-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
cloud-policy-guard = "cloud_policy_guard.cli:main"
cpg = "cloud_policy_guard.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/cloud-policy-guard"
Repository = "https://github.com/yourusername/cloud-policy-guard"
"Bug Tracker" = "https://github.com/yourusername/cloud-policy-guard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["cloud_policy_guard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# ── ruff (linting) ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

# ── black (formatting) ────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

# ── dev dependencies (install with: pip install -e ".[dev]") ──────────────────
[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.6",
    "ruff>=0.1",
    "black>=23.0",
]
