name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Run Pytest
      run: pytest -v

  demo-scan:
    name: Run Demo Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install Cloud Policy Guard
      run: pip install -e .
      
    - name: Verify Secure Plan Passes
      run: cloud-policy-guard scan --terraform-plan examples/secure/plan.json
      
    - name: Verify Vulnerable Plan Fails
      # We expect this to fail, so we negate the command to make the workflow pass
      run: |
        if cloud-policy-guard scan --terraform-plan examples/vulnerable/plan.json; then
          echo "Expected failure, but it passed!"
          exit 1
        else
          echo "Successfully caught vulnerable plan."
          exit 0
        fi
